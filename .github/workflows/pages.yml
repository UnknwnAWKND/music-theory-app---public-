name: Build Theory Tutor

on:
  push:
    branches: ["main", "rebuild/**", "block2-*", "block3-*", "block4-*", "block5-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: theory-tutor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run curriculum and learning-engine tests
        run: npm test
      - name: Build static site
        run: npm run build:site
      - name: Sync tested site to docs on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          rm -rf docs
          cp -R site docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs already match tested build"
            exit 0
          fi
          git commit -m "Deploy Block 5 Phase 4 diatonic harmony"
          git push origin HEAD:main
