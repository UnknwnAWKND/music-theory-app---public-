name: Deploy Theory Tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install
      - name: Verify curriculum and learning engine
        run: npm test
      - name: Build static site with public Supabase config
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('web/config.js', 'utf8');
          const url = text.match(/supabaseUrl:\s*\"([^\"]+)\"/);
          const key = text.match(/supabasePublishableKey:\s*\"([^\"]+)\"/);
          if (!url || !key) process.exit(1);
          console.log(`export SUPABASE_URL='${url[1]}'`);
          console.log(`export SUPABASE_PUBLISHABLE_KEY='${key[1]}'`);
          NODE
          )"
          npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
