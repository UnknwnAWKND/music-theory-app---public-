name: Build Theory Tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theory-tutor-build
  cancel-in-progress: true

jobs:
  test-build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Apply lesson clarity rules
        run: |
          python scripts/apply-lesson-clarity.py
          python scripts/final-lesson-clarity.py
      - name: Apply 2026 UI redesign
        run: |
          python scripts/redesign-ui.py
          python scripts/ui-polish.py
      - name: Apply learning engine foundation
        run: |
          python scripts/remove-phase0-curriculum.py
          python scripts/learning-engine-foundation.py
          python scripts/prepare-schema-foundation.py
          python scripts/persistence-foundation.py
      - name: Apply adaptive learning engine
        run: |
          python scripts/apply-adaptive-learning.py
          python scripts/guard-manual-cold-review.py
      - name: Apply phase checkpoints and placement
        run: |
          python scripts/prepare-phase-checkpoint-transform.py
          python scripts/apply-phase-checkpoints.py
          python scripts/finalize-phase-checkpoints.py
      - name: Verify curriculum and learning engine
        run: npm test
      - name: Check common mobile and tablet widths
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf web/core' EXIT
          rm -rf web/core
          cp -R dist web/core
          node scripts/responsive-smoke.mjs
      - name: Build static site with public Supabase config
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('web/config.js', 'utf8');
          const url = text.match(/supabaseUrl:\s*\"([^\"]+)\"/);
          const key = text.match(/supabasePublishableKey:\s*\"([^\"]+)\"/);
          if (!url || !key) process.exit(1);
          console.log(`export SUPABASE_URL='${url[1]}'`);
          console.log(`export SUPABASE_PUBLISHABLE_KEY='${key[1]}'`);
          NODE
          )"
          npm run build:site
      - name: Sync tested build to docs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs
          cp -R site docs
      - name: Commit tested source and docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Deploy phase checkpoints and placement"
            git push
          fi
