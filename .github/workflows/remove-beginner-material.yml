name: Remove beginner material

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove beginner material from source curriculum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skills = Path('src/curriculum/skills.ts')
          s = skills.read_text()
          s = s.replace('  s("pitch.note-names", 0, "Name piano notes", [], ["identify"], ["pitch"]),\n', '')
          s = s.replace('s("pitch.accidentals", 0, "Sharps, flats, and enharmonic spellings", ["pitch.note-names"]', 's("pitch.accidentals", 0, "Sharps, flats, and enharmonic spellings", []')
          s = s.replace('s("pitch.half-whole", 0, "Half steps and whole steps", ["pitch.note-names"]', 's("pitch.half-whole", 0, "Half steps and whole steps", []')
          s = s.replace('s("interval.generic-number", 1, "Generic interval number", ["pitch.note-names"]', 's("interval.generic-number", 1, "Generic interval number", []')
          s = s.replace('s("scale.degree-numbers", 3, "Scale degrees 1–7", ["pitch.note-names"]', 's("scale.degree-numbers", 3, "Scale degrees 1–7", ["major.formula"]')
          s = s.replace('s("guitar.open-strings", 12, "Standard-tuning open strings", ["pitch.note-names"]', 's("guitar.open-strings", 12, "Standard-tuning open strings", ["analysis.integrated"]')
          if 'pitch.note-names' in s or 'Name piano notes' in s:
              raise SystemExit('pitch.note-names still exists in curriculum')
          skills.write_text(s)

          catalog = Path('src/exercises/catalog.ts')
          c = catalog.read_text()
          c, n = re.subn(r'\n  if \(skillId === "pitch\.note-names"\) \{.*?\n  \}\n  if \(skillId === "pitch\.accidentals"\)', '\n  if (skillId === "pitch.accidentals")', c, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('could not remove note-naming exercise branch')
          catalog.write_text(c)

          lessons = Path('src/practice/lessons.ts')
          l = lessons.read_text()
          l = l.replace('    "pitch.note-names": { summary: "On piano, the white-key letter names repeat A through G. B–C and E–F are adjacent white keys with no black key between them." },\n', '')
          if 'pitch.note-names' in l:
              raise SystemExit('pitch.note-names still exists in lesson source')
          lessons.write_text(l)

          planner = Path('src/session/planner.ts')
          p = planner.read_text()
          p = p.replace('import type { DerivedSkillEvidence } from "../learning/index.js";\n', 'import type { DerivedSkillEvidence } from "../learning/index.js";\n\nconst CURRENT_SKILL_IDS = new Set(SKILLS.map((skill) => skill.id));\n')
          p = p.replace('.filter(([, evidence]) => evidence.fragile)', '.filter(([skillId, evidence]) => CURRENT_SKILL_IDS.has(skillId) && evidence.fragile)')
          p = p.replace('const sortedDue = [...input.dueReviews].sort((a, b) => {', 'const sortedDue = [...input.dueReviews]\n    .filter((review) => CURRENT_SKILL_IDS.has(review.skillId))\n    .sort((a, b) => {')
          p = p.replace('  });\n  const budget = sortedDue.length', '    });\n  const budget = sortedDue.length', 1)
          p = p.replace('const acquiringSkillId = input.acquiringSkillIds?.find((id) => input.evidenceBySkill.get(id)?.state === "acquiring");', 'const acquiringSkillId = input.acquiringSkillIds?.find((id) => CURRENT_SKILL_IDS.has(id) && input.evidenceBySkill.get(id)?.state === "acquiring");')
          planner.write_text(p)

          curriculum_test = Path('tests/curriculum.test.mjs')
          t = curriculum_test.read_text()
          t = t.replace('assert.deepEqual(unlocked.map((x) => x.id), ["pitch.note-names"]);', 'assert.deepEqual(unlocked.map((x) => x.id).sort(), ["interval.generic-number", "pitch.accidentals", "pitch.half-whole"]);')
          curriculum_test.write_text(t)

          service_test = Path('tests/service.test.mjs')
          t = service_test.read_text().replace('pitch.note-names', 'pitch.accidentals')
          service_test.write_text(t)

          session_test = Path('tests/session.test.mjs')
          t = session_test.read_text().replace('pitch.note-names', 'pitch.accidentals')
          t = t.replace('const due = Array.from({ length: 8 }, (_, i) => ({ skillId: `x${i}`, dueAt: `2026-09-0${i+1}T00:00:00Z`, urgency: i }));', 'const due = SKILLS.slice(0, 8).map((skill, i) => ({ skillId: skill.id, dueAt: `2026-09-0${i+1}T00:00:00Z`, urgency: i }));')
          session_test.write_text(t)
          PY
      - name: Add regression test for hard curriculum boundary
        shell: bash
        run: |
          cat > tests/no-beginner-material.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          import { SKILLS } from "../dist/curriculum/index.js";

          test("beginner piano-note naming is absent, not hidden", () => {
            assert.equal(SKILLS.some((x) => x.id === "pitch.note-names"), false);
            const files = [
              "src/curriculum/skills.ts",
              "src/exercises/catalog.ts",
              "src/practice/lessons.ts",
            ].map((p) => fs.readFileSync(p, "utf8")).join("\n");
            assert.equal(/pitch\.note-names|Name piano notes|Name the highlighted natural piano key/i.test(files), false);
          });

          test("curriculum has none of the explicitly excluded beginner subjects", () => {
            const text = SKILLS.map((x) => `${x.id} ${x.title} ${(x.tags ?? []).join(" ")}`).join("\n");
            assert.equal(/\b(sheet music|treble clef|bass clef|finger numbers|posture|basic improvisation|ear training|aural training)\b/i.test(text), false);
          });
          EOF
      - name: Install and verify
        run: |
          npm install
          npm test
          npm run build:site
      - name: Update only generated core files used by GitHub Pages
        shell: bash
        run: |
          cp site/core/curriculum/skills.js docs/core/curriculum/skills.js
          cp site/core/exercises/catalog.js docs/core/exercises/catalog.js
          cp site/core/practice/lessons.js docs/core/practice/lessons.js
          cp site/core/session/planner.js docs/core/session/planner.js
      - name: Verify deployed curriculum contains no deleted material
        shell: bash
        run: |
          if grep -R -E 'pitch\.note-names|Name piano notes|Name the highlighted natural piano key' src/curriculum src/exercises src/practice docs/core/curriculum docs/core/exercises docs/core/practice; then
            echo 'Deleted beginner material is still present.'
            exit 1
          fi
          grep -q 'CURRENT_SKILL_IDS' docs/core/session/planner.js
      - name: Commit verified cleanup
        shell: bash
        run: |
          rm .github/workflows/remove-beginner-material.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/skills.ts src/exercises/catalog.ts src/practice/lessons.ts src/session/planner.ts tests/curriculum.test.mjs tests/service.test.mjs tests/session.test.mjs tests/no-beginner-material.test.mjs docs/core/curriculum/skills.js docs/core/exercises/catalog.js docs/core/practice/lessons.js docs/core/session/planner.js .github/workflows/remove-beginner-material.yml
          git commit -m 'Remove excluded beginner material from curriculum'
          git push origin HEAD:main
