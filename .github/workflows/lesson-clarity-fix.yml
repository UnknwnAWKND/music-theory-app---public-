name: Lesson clarity migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lesson clarity changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('web/app.js')
          s = app.read_text()

          phase_marker = 'const PHASE_TITLES = Object.freeze({\n'
          if phase_marker not in s:
              raise SystemExit('phase titles marker missing')
          # Insert after PHASE_TITLES block only once.
          end_marker = '});\n\nfunction evidenceReady'
          phase_help = r'''});

const PHASE_INTROS = Object.freeze({
  0: ["This phase is about note names that share the same piano key.", "You will learn when one sound can have more than one correct name."],
  1: ["This phase is about intervals.", "Intervals tell you the distance between two notes. They are the building blocks for scales and chords."],
  2: ["This phase is about triads.", "Triads are simple three-note chords. You will learn how their notes are built from the root."],
  3: ["This phase is about major scales.", "You will learn the pattern behind every major key instead of memorizing unrelated note lists."],
  4: ["This phase is about the chords inside a major key.", "You will learn which chords naturally belong to a key and why."],
  5: ["This phase is about chord numbers and progressions.", "The goal is to recognize a progression by its relationships and move it to any key."],
  6: ["This phase is about what chords do.", "Some chords feel like home, some create movement, and some create tension that wants to resolve."],
  7: ["This phase is about minor keys.", "You will connect minor scales, chords, and the way minor harmony actually behaves."],
  8: ["This phase is about seventh chords.", "These are triads with one more note added. They give you more harmonic color and stronger function."],
  9: ["This phase is about inversions and voice leading.", "You will learn how the same chord can be arranged differently and how to move smoothly between chords."],
  10: ["This phase is about relationships between keys.", "The Circle of Fifths is a map that helps organize keys, accidentals, and nearby key changes."],
  11: ["This phase is about advanced practical harmony.", "You will add more chord colors and ways to move outside the basic key without losing the musical center."],
  12: ["This phase moves the theory onto guitar.", "You will map the same note, interval, chord, and scale relationships across the fretboard."],
});

const NEW_WORD_CARDS = Object.freeze({
  "pitch.accidentals": [
    ["Enharmonic", "Two note names that use the same piano key and make the same sound.", "C♯ and D♭ are enharmonic. They are two names for the same black key."],
  ],
  "interval.generic-number": [
    ["Interval", "The distance between two notes.", "C to E is an interval."],
  ],
  "interval.quality-system": [
    ["Quality", "The word that tells you the exact size of an interval.", "A 3rd can be major or minor. Major and minor are qualities."],
  ],
  "triad.members": [
    ["Triad", "A three-note chord built from a root, a 3rd, and a 5th.", "C–E–G is a C major triad."],
  ],
  "scale.degree-numbers": [
    ["Scale degree", "A number that tells you where a note sits inside a scale.", "In C major, C is 1 and G is 5."],
  ],
  "diatonic.definition": [
    ["Diatonic", "A note or chord that belongs to the current key.", "In C major, C, D, E, F, G, A, and B are diatonic notes."],
    ["Chromatic", "A note that is outside the current key.", "In C major, F♯ is chromatic."],
  ],
  "roman.major-basic": [
    ["Roman numeral", "A number used to show which scale degree a chord is built on.", "In C major, C major is I and G major is V."],
  ],
  "function.tonic": [
    ["Tonic", "The musical home or center of a key.", "In C major, C is the tonic."],
  ],
  "function.dominant": [
    ["Dominant", "A chord or note that creates strong pull back toward tonic.", "In C major, G major is the V chord and strongly pulls toward C."],
  ],
  "function.predominant": [
    ["Predominant", "A chord that commonly moves toward the dominant.", "In C major, D minor or F major often moves toward G."],
  ],
  "cadence.basic": [
    ["Cadence", "A chord movement that creates a feeling of pause, ending, or resolution.", "V→I is a strong cadence."],
  ],
  "minor.relative": [
    ["Relative major/minor", "A major key and minor key that use the same notes but have different home notes.", "C major and A minor use the same notes."],
  ],
});

function evidenceReady'''
          if 'const PHASE_INTROS' not in s:
              if end_marker not in s:
                  raise SystemExit('phase block end marker missing')
              s = s.replace(end_marker, phase_help, 1)

          start = s.index('function renderLessonStep(item, label = "Learn") {')
          end = s.index('\nasync function loadExercise(item) {', start)
          replacement = r'''function lessonPagesFor(item) {
  const lesson = lessonForSkill(item.skillId);
  const skill = SKILL_BY_ID.get(item.skillId);
  const pages = [];
  const firstInPhase = skill && SKILLS.find((x) => x.phase === skill.phase)?.id === skill.id;

  if (item.kind === "new" && firstInPhase) {
    const intro = PHASE_INTROS[skill.phase];
    if (intro) pages.push({ eyebrow: `Phase ${skill.phase}`, title: intro[0], body: intro[1] });
  }

  for (const [word, meaning, example] of NEW_WORD_CARDS[item.skillId] ?? []) {
    pages.push({ eyebrow: "New word", title: word, body: meaning, example });
  }

  pages.push({ eyebrow: "One idea", title: lesson.title, body: lesson.summary });
  if (lesson.rule) pages.push({ eyebrow: "Rule", title: "Keep this simple", body: lesson.rule });
  if (lesson.workedExample) pages.push({ eyebrow: "Example", title: "Here is one", body: lesson.workedExample });
  return pages;
}

function renderLessonStep(item, label = "Learn", pageIndex = 0) {
  const pages = lessonPagesFor(item);
  const page = pages[Math.min(pageIndex, pages.length - 1)];
  state.lessonVisible = true;
  root.innerHTML = `
    ${topbarHtml(skillPhase(item.skillId))}
    <section class="card lesson-card-simple">
      <div class="eyebrow">${esc(page.eyebrow)}</div>
      <h1>${esc(page.title)}</h1>
      <div class="lesson-simple-copy">${esc(page.body)}</div>
      ${page.example ? `<div class="example-simple"><strong>Example</strong><div>${esc(page.example)}</div></div>` : ""}
      <div class="lesson-page-count">${pageIndex + 1} of ${pages.length}</div>
      <button class="primary" id="lessonTry">${pageIndex < pages.length - 1 ? "Continue" : (item.kind === "review-repair" ? "Try a repair question" : "Try it")}</button>
    </section>`;
  document.querySelector("#lessonTry").onclick = async () => {
    if (pageIndex < pages.length - 1) return renderLessonStep(item, label, pageIndex + 1);
    state.lessonVisible = false;
    if (item.kind === "review-repair") state.supportedNext = true;
    await loadExercise(item);
  };
}
'''
          s = s[:start] + replacement + s[end:]

          old_feedback = '''function feedbackHtml() {\n  if (!state.feedback) return "";\n  const f = state.feedback;\n  const expected = f.expected ? `<div class="expected"><strong>Answer:</strong> ${esc(f.expected)}</div>` : "";\n  return `<div class="feedback ${f.correct ? "correct" : "wrong"}"><div class="feedback-title">${f.correct ? "Correct" : "Not quite"}</div><div>${esc(f.detail)}</div>${expected}</div>`;\n}'''
          new_feedback = '''function feedbackHtml() {\n  if (!state.feedback) return "";\n  const f = state.feedback;\n  const answer = f.expected ? `<div class="expected">${f.correct ? "Answer" : "Correct answer"}: ${esc(f.expected)}</div>` : "";\n  const message = f.correct ? "You got it." : "Use the correction, then try the next one.";\n  return `<div class="feedback ${f.correct ? "correct" : "wrong"}"><div class="feedback-title">${f.correct ? "Correct" : "Not quite"}</div><div>${message}</div>${answer}</div>`;\n}'''
          if old_feedback in s:
              s = s.replace(old_feedback, new_feedback, 1)
          else:
              raise SystemExit('feedback function marker missing')

          s = s.replace('Separate notes with spaces or commas. # and b are accepted and normalized.', 'You can type #, ♯, sharp, b, ♭, or flat. Spaces and hyphens are fine.')
          s = s.replace('Separate notes with spaces or commas. # and b are accepted.', 'Separate notes with spaces or commas. You can type #, ♯, sharp, b, ♭, or flat.')
          app.write_text(s)

          lessons = Path('src/practice/lessons.ts')
          t = lessons.read_text()
          replacements = {
            '"pitch.accidentals": { summary: "You already know what sharps and flats are. The new idea here is enharmonic spelling: two note names can point to the exact same piano key while meaning different things in theory. For example, A♯ and B♭ sound the same on a modern piano, but the correct name depends on the musical relationship you are describing. This matters because scales, intervals, and chords are built from letter relationships as well as sound. So the app will sometimes require the theoretically correct name even when another name would land on the same key.", rule: "Choose the note name that preserves the correct letter structure of the scale, interval, or chord—not merely a name for the same piano key.", workedExample: "In F♯ major, the third scale degree is A♯, not B♭. F♯–G♯–A♯ uses consecutive letter names F–G–A. Writing B♭ would skip A and break the scale spelling even though A♯ and B♭ are the same piano key." },': '"pitch.accidentals": { summary: "Sometimes the same piano key has two different note names.", rule: "The name can change even when the piano key does not.", workedExample: "C♯ and D♭ are the same black key on the piano." },',
            '"pitch.half-whole": { summary: "Half steps and whole steps are the distance units we will use to construct intervals and scales. A half step moves to the immediately adjacent piano key, regardless of color; a whole step spans two half steps. The important part is not memorizing the definition—it is being able to use these distances quickly when deriving larger structures.", rule: "Half step = 1 semitone. Whole step = 2 semitones.", workedExample: "E→F is a half step even though both are white keys. F→G is a whole step because F→F♯ and F♯→G are two half steps." },': '"pitch.half-whole": { summary: "Half steps and whole steps measure distance between notes.", rule: "Half step = one piano key to the next. Whole step = two half steps.", workedExample: "E→F is a half step. F→G is a whole step." },',
            '"interval.generic-number": { summary: "An interval has two parts: a number and a quality. The number tells you how many letter names the interval spans. Count the starting and ending letters inclusively. This is why written note names matter before semitone distance does.", rule: "Count letters first: C–D = 2nd, C–E = 3rd, C–F = 4th, and so on. Accidentals do not change the interval number.", workedExample: "C→E♭ is still a 3rd because C–D–E spans three letters. C→D♯ is a 2nd because C–D spans two letters, even though D♯ and E♭ are the same piano key." },': '"interval.generic-number": { summary: "The interval number comes from the letter names.", rule: "Count both the starting note and ending note.", workedExample: "C→E is a 3rd because C–D–E gives you three letter names." },',
            '"interval.quality-system": { summary: "The interval number tells you the letter span; the quality tells you its exact size. There are two quality families. Unisons, 4ths, 5ths, and octaves use perfect as their normal form. 2nds, 3rds, 6ths, and 7ths use major and minor as their normal forms. Augmented means one semitone wider than the normal reference; diminished means one semitone narrower.", rule: "Perfect family: 1, 4, 5, 8. Major/minor family: 2, 3, 6, 7. Determine the letter number first, then use semitone distance to determine quality.", workedExample: "C→E is a 3rd by letters and spans 4 semitones, so it is a major 3rd. C→E♭ is still a 3rd, but spans 3 semitones, so it is a minor 3rd." },': '"interval.quality-system": { summary: "The interval number tells you the letter distance. The quality tells you the exact size.", rule: "2nds, 3rds, 6ths, and 7ths can be major or minor. 1, 4, 5, and 8 use perfect.", workedExample: "C→E is a major 3rd. C→E♭ is a minor 3rd." },',
            '"triad.members": { summary: "A basic tertian triad is organized around three chord-member roles: root, third, and fifth. Those names describe each note’s interval relationship to the chord root, not where the note happens to sit physically. This distinction becomes important once we use inversions and different voicings.", rule: "Root = identity of the chord; third = determines major/minor quality in basic triads; fifth = completes the core triad structure.", workedExample: "C–E–G and E–G–C contain the same chord members: C is still the root, E the third, and G the fifth even when C is not the lowest note." },': '"triad.members": { summary: "A triad has three roles: root, 3rd, and 5th.", rule: "Those names describe each note’s distance from the root.", workedExample: "In C–E–G: C is the root, E is the 3rd, and G is the 5th." },',
          }
          for old,new in replacements.items():
              if old not in t:
                  raise SystemExit('lesson replacement marker missing')
              t = t.replace(old,new,1)
          lessons.write_text(t)

          catalog = Path('src/exercises/catalog.ts')
          c = catalog.read_text()
          phrase_replacements = {
            'Identify the enharmonic equivalent of': 'What is another name for',
            'Give the enharmonic equivalent of': 'What is another name for',
            'Provide the enharmonic equivalent of': 'What is another name for',
            'enharmonic equivalent': 'other name',
            'Identify the interval': 'What interval is this',
          }
          for old,new in phrase_replacements.items():
              c = c.replace(old,new)
          catalog.write_text(c)

          css = Path('web/styles.css')
          cs = css.read_text()
          if '.lesson-simple-copy' not in cs:
              cs += r'''
.lesson-card-simple { max-width: 620px; margin: 0 auto; }
.lesson-simple-copy { font-size: 1.16rem; line-height: 1.55; margin: 18px 0 22px; }
.example-simple { margin: 18px 0 24px; padding: 16px; border-radius: 14px; background: #1b1e24; border: 1px solid #30343d; line-height: 1.5; }
.example-simple strong { display: block; color: #a1a1aa; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 7px; }
.lesson-page-count { color: #71717a; font-size: .78rem; text-align: center; margin: 10px 0 14px; }
'''
          css.write_text(cs)
          PY
      - name: Test and build
        run: npm test
      - name: Commit migration result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/styles.css src/practice/lessons.ts src/exercises/catalog.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Simplify lessons and question wording"
            git push
          fi
