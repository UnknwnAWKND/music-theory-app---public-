name: Upgrade curriculum UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI and lesson changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('web/app.js')
          s = app.read_text()
          s = s.replace('  TutorService,\n  SKILL_BY_ID,', '  TutorService,\n  SKILLS,\n  SKILL_BY_ID,')

          marker = 'function renderToday() {\n'
          if marker not in s:
              raise SystemExit('renderToday marker missing')
          insert = r'''const PHASE_TITLES = Object.freeze({
  0: "Foundations",
  1: "Intervals",
  2: "Triads",
  3: "Major scales",
  4: "Diatonic major harmony",
  5: "Progressions & transposition",
  6: "Harmonic function",
  7: "Minor tonality",
  8: "Seventh chords",
  9: "Inversions, voicings & voice leading",
  10: "Circle of Fifths & key relationships",
  11: "Advanced practical harmony",
  12: "Transfer to guitar",
});

function evidenceReady(evidence) {
  return Boolean(evidence?.ready || evidence?.retained || evidence?.state === "ready" || evidence?.state === "retained");
}

function skillStatus(skill, evidence, readyIds) {
  if (evidence?.fragile) return { label: "Repair", cls: "repair" };
  if (evidence?.retained || evidence?.state === "retained") return { label: "Retained", cls: "retained" };
  if (evidenceReady(evidence)) return { label: "Ready", cls: "ready" };
  if (evidence?.state === "acquiring") return { label: "In progress", cls: "current" };
  const prereqsMet = skill.prerequisites.every((id) => readyIds.has(id));
  return prereqsMet ? { label: "Available", cls: "available" } : { label: "Locked", cls: "locked" };
}

async function renderCurriculum() {
  const records = await repo.allSkillStates(USER_ID);
  const byId = new Map(records.map((record) => [record.skillId, record.evidence]));
  const readyIds = new Set(records.filter((record) => evidenceReady(record.evidence)).map((record) => record.skillId));
  const phaseHtml = [];

  for (let phase = 0; phase <= 12; phase += 1) {
    const skills = SKILLS.filter((skill) => skill.phase === phase);
    const required = skills.filter((skill) => !skill.optional);
    const complete = required.length > 0 && required.every((skill) => readyIds.has(skill.id));
    const anyStarted = skills.some((skill) => byId.has(skill.id));
    const anyAvailable = skills.some((skill) => skill.prerequisites.every((id) => readyIds.has(id)));
    const phaseState = complete ? "Complete" : (anyStarted || anyAvailable) ? "Current" : "Locked";
    const rows = skills.map((skill) => {
      const status = skillStatus(skill, byId.get(skill.id), readyIds);
      return `<div class="curriculum-skill ${status.cls}"><div class="curriculum-skill-copy"><strong>${esc(skill.title)}</strong>${skill.optional ? '<span class="optional-tag">Optional</span>' : ''}</div><span class="status-chip ${status.cls}">${esc(status.label)}</span></div>`;
    }).join("");
    phaseHtml.push(`<section class="curriculum-phase ${phaseState.toLowerCase()}"><div class="curriculum-phase-head"><div><div class="phase-number">Phase ${phase}</div><h2>${esc(PHASE_TITLES[phase] ?? `Phase ${phase}`)}</h2></div><span class="phase-status ${phaseState.toLowerCase()}">${phaseState === "Locked" ? "🔒 Locked" : esc(phaseState)}</span></div><div class="curriculum-skills">${rows}</div></section>`);
  }

  root.innerHTML = `
    ${topbarHtml("Curriculum")}
    <section class="card curriculum-intro">
      <div class="eyebrow">Full curriculum</div>
      <h1>See the whole path.</h1>
      <p class="muted">Every phase is visible here. This is a roadmap, not a skip menu: locked material stays locked until the learning engine says its prerequisites are ready.</p>
      <button class="secondary curriculum-back" id="curriculumBack" type="button">Back to today</button>
    </section>
    <div class="curriculum-map">${phaseHtml.join("")}</div>
    ${footerHtml()}`;
  document.querySelector("#curriculumBack").onclick = renderToday;
}

'''
          s = s.replace(marker, insert + marker, 1)

          old = '      <button class="primary" id="startBtn">${state.queue.length ? "Start" : "Finish"}</button>\n    </section>'
          new = '      <div class="home-actions"><button class="primary" id="startBtn">${state.queue.length ? "Start" : "Finish"}</button><button class="secondary" id="curriculumBtn" type="button">View full curriculum</button></div>\n    </section>'
          if old not in s:
              raise SystemExit('start button marker missing')
          s = s.replace(old, new, 1)
          old = '  document.querySelector("#startBtn").onclick = state.queue.length ? beginItem : finishSession;\n}'
          new = '  document.querySelector("#startBtn").onclick = state.queue.length ? beginItem : finishSession;\n  document.querySelector("#curriculumBtn").onclick = () => renderCurriculum().catch(showFatal);\n}'
          if old not in s:
              raise SystemExit('start handler marker missing')
          s = s.replace(old, new, 1)

          old = '''      <div class="lesson">\n        <strong>${esc(lesson.summary)}</strong>\n        ${lesson.rule ? `<div class="rule">Rule: ${esc(lesson.rule)}</div>` : ""}\n        ${lesson.workedExample ? `<div class="example">Example: ${esc(lesson.workedExample)}</div>` : ""}\n      </div>'''
          new = '''      <div class="lesson">\n        <div class="lesson-label">What this means</div>\n        <div class="lesson-summary">${esc(lesson.summary)}</div>\n        ${lesson.rule ? `<div class="rule"><span>Rule</span>${esc(lesson.rule)}</div>` : ""}\n        ${lesson.workedExample ? `<div class="example"><span>Example</span>${esc(lesson.workedExample)}</div>` : ""}\n      </div>'''
          if old not in s:
              raise SystemExit('lesson display marker missing')
          s = s.replace(old, new, 1)
          app.write_text(s)

          lessons = Path('src/practice/lessons.ts')
          t = lessons.read_text()
          old = '"pitch.accidentals": { summary: "Sharps raise a written note by a semitone; flats lower it by a semitone. Enharmonic spellings can sound the same but have different theoretical meanings." },'
          new = '"pitch.accidentals": { summary: "You already know what sharps and flats are. The new idea here is enharmonic spelling: two note names can point to the exact same piano key while meaning different things in theory. For example, A♯ and B♭ sound the same on a modern piano, but the correct name depends on the musical relationship you are describing. This matters because scales, intervals, and chords are built from letter relationships as well as sound. So the app will sometimes require the theoretically correct name even when another name would land on the same key.", rule: "Choose the note name that preserves the correct letter structure of the scale, interval, or chord—not merely a name for the same piano key.", workedExample: "In F♯ major, the third scale degree is A♯, not B♭. F♯–G♯–A♯ uses consecutive letter names F–G–A. Writing B♭ would skip A and break the scale spelling even though A♯ and B♭ are the same piano key." },'
          if old not in t:
              raise SystemExit('pitch.accidentals lesson marker missing')
          t = t.replace(old, new, 1)
          replacements = {
            '"pitch.half-whole": { summary: "A half step is one adjacent piano key; a whole step is two half steps." },': '"pitch.half-whole": { summary: "Half steps and whole steps are the distance units we will use to construct intervals and scales. A half step moves to the immediately adjacent piano key, regardless of color; a whole step spans two half steps. The important part is not memorizing the definition—it is being able to use these distances quickly when deriving larger structures.", rule: "Half step = 1 semitone. Whole step = 2 semitones.", workedExample: "E→F is a half step even though both are white keys. F→G is a whole step because F→F♯ and F♯→G are two half steps." },',
            '"interval.generic-number": { summary: "Interval number comes from counting letter names inclusively: C–E is some kind of 3rd because C–D–E spans three letters." },': '"interval.generic-number": { summary: "An interval has two parts: a number and a quality. The number tells you how many letter names the interval spans. Count the starting and ending letters inclusively. This is why the written note names matter before semitone distance does.", rule: "Count letters first: C–D = 2nd, C–E = 3rd, C–F = 4th, and so on. Accidentals do not change the interval number.", workedExample: "C→E♭ is still a 3rd because C–D–E spans three letters. C→D♯ is a 2nd because C–D spans two letters, even though D♯ and E♭ are the same piano key." },',
            '"interval.quality-system": { summary: "Unisons, 4ths, 5ths, and octaves use perfect/augmented/diminished qualities. 2nds, 3rds, 6ths, and 7ths use major/minor plus augmented/diminished." },': '"interval.quality-system": { summary: "The interval number tells you the letter span; the quality tells you its exact size. There are two quality families. Unisons, 4ths, 5ths, and octaves use perfect as their normal form. 2nds, 3rds, 6ths, and 7ths use major and minor as their normal forms. Augmented means one semitone wider than the normal reference; diminished means one semitone narrower.", rule: "Perfect family: 1, 4, 5, 8. Major/minor family: 2, 3, 6, 7. Determine the letter number first, then use semitone distance to determine quality.", workedExample: "C→E is a 3rd by letters and spans 4 semitones, so it is a major 3rd. C→E♭ is still a 3rd, but spans 3 semitones, so it is a minor 3rd." },',
            '"interval.spelling": { summary: "Correct interval spelling uses the proper target letter first, then the accidental that creates the required semitone distance." },': '"interval.spelling": { summary: "Correct interval construction is a two-step problem. First choose the target letter required by the interval number. Only then choose the accidental needed to produce the correct semitone distance. This prevents enharmonic answers that sound right but describe the wrong interval on paper.", rule: "Letter first, accidental second.", workedExample: "A major 3rd above F♯ must use some kind of A because F–G–A is a 3rd. The A must be raised to A♯ to make the distance 4 semitones. B♭ lands on the same key but is some kind of 4th from F, so it is spelled incorrectly for this task." },',
            '"triad.members": { summary: "A tertian triad has root, third, and fifth. These are chord-member roles relative to the root, not simply bottom/middle/top notes." },': '"triad.members": { summary: "A basic tertian triad is organized around three chord-member roles: root, third, and fifth. Those names describe each note’s interval relationship to the chord root, not where the note happens to sit physically. This distinction becomes important once we use inversions and different voicings.", rule: "Root = identity of the chord; third = determines major/minor quality in basic triads; fifth = completes the core triad structure.", workedExample: "C–E–G and E–G–C contain the same chord members: C is still the root, E the third, and G the fifth even when C is not the lowest note." },',
          }
          for a,b in replacements.items():
              if a not in t:
                  raise SystemExit('lesson marker missing: ' + a[:40])
              t = t.replace(a,b,1)
          lessons.write_text(t)

          css = Path('web/styles.css')
          css.write_text(r''':root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f4f4f5;
  background: #0b0c0f;
  color-scheme: dark;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #0b0c0f; color: #f4f4f5; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.app-shell { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 30px 0 54px; }
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 26px; }
.brand { font-size: 1.08rem; font-weight: 760; letter-spacing: -0.02em; }
.phase-pill { font-size: .78rem; color: #a1a1aa; }
.card { background: #14161b; border: 1px solid #272a31; border-radius: 20px; padding: 24px; box-shadow: 0 10px 34px rgba(0,0,0,.28); }
.hero h1, .card h1 { margin: 0 0 8px; font-size: clamp(1.75rem, 5vw, 2.45rem); letter-spacing: -.04em; line-height: 1.04; }
.hero p, .muted { color: #a1a1aa; line-height: 1.55; }
.plan { margin: 24px 0; display: grid; gap: 10px; }
.plan-row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #282b33; }
.plan-row:last-child { border-bottom: 0; }
.plan-row strong { font-weight: 700; }
.primary, .secondary, .choice { border-radius: 13px; border: 1px solid transparent; padding: 13px 16px; font-weight: 700; }
.primary { width: 100%; background: #f4f4f5; color: #101114; }
.primary:disabled { opacity: .45; cursor: default; }
.secondary { width: 100%; background: #1b1e24; border-color: #343842; color: #f4f4f5; }
.choice { width: 100%; text-align: left; background: #1a1c22; border-color: #30343d; color: #f4f4f5; font-weight: 600; }
.choice:hover { border-color: #626875; }
.choice.selected { border-color: #d4d4d8; background: #262931; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: #9297a3; font-weight: 800; margin-bottom: 10px; }
.progress-track { height: 5px; background: #292c33; border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
.progress-bar { height: 100%; background: #f4f4f5; border-radius: inherit; transition: width .2s ease; }
.lesson { margin: 18px 0 24px; padding: 18px; border-radius: 14px; background: #1a1d23; border: 1px solid #2b2f38; line-height: 1.6; }
.lesson-label, .rule span, .example span { display: block; text-transform: uppercase; letter-spacing: .09em; font-size: .68rem; color: #8f95a1; font-weight: 800; margin-bottom: 6px; }
.lesson-summary { color: #eceef2; }
.rule, .example { margin-top: 16px; padding-top: 14px; border-top: 1px solid #30343d; }
.rule { font-weight: 650; }
.example { color: #c5c9d1; }
.prompt { font-size: 1.28rem; line-height: 1.4; font-weight: 680; margin: 10px 0 22px; letter-spacing: -.015em; }
.answer-stack { display: grid; gap: 12px; }
.answer-input, select { width: 100%; border: 1px solid #343842; background: #111318; color: #f4f4f5; border-radius: 12px; padding: 13px 14px; outline: none; }
.answer-input:focus, select:focus { border-color: #858b98; box-shadow: 0 0 0 3px rgba(255,255,255,.06); }
.field-label { font-size: .83rem; font-weight: 700; color: #b0b4bd; margin-bottom: -5px; }
.hint { font-size: .8rem; color: #9297a3; line-height: 1.45; }
.feedback { margin-top: 18px; padding: 15px 16px; border-radius: 13px; line-height: 1.48; }
.feedback.correct { background: #13261a; border: 1px solid #254b31; }
.feedback.wrong { background: #2b1717; border: 1px solid #603030; }
.feedback-title { font-weight: 800; margin-bottom: 4px; }
.feedback .expected { margin-top: 7px; font-size: .9rem; }
.actions, .home-actions { display: grid; gap: 10px; margin-top: 18px; }
.self-check-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.session-meta { display: flex; justify-content: space-between; gap: 16px; color: #9297a3; font-size: .8rem; margin-bottom: 10px; }
.done-mark { font-size: 2.2rem; margin-bottom: 12px; }
.footer { margin-top: 24px; text-align: center; color: #777d89; font-size: .74rem; }
.error-box { background: #2b1717; border: 1px solid #603030; border-radius: 14px; padding: 16px; line-height: 1.45; }
.mini-keyboard { position: relative; height: 126px; display: grid; grid-template-columns: repeat(7, 1fr); margin: -8px 0 22px; border: 1px solid #4b505b; border-radius: 10px; overflow: hidden; background: #050506; }
.white-key { position: relative; background: #ececec; border-right: 1px solid #a9a9aa; min-width: 0; }
.white-key:last-child { border-right: 0; }
.white-key.active { background: #aeb3bd; box-shadow: inset 0 -8px 0 rgba(0,0,0,.16); }
.black-key { position: absolute; z-index: 2; top: 0; right: -18%; width: 36%; height: 62%; background: #090a0c; border-radius: 0 0 4px 4px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.text-button { border: 0; padding: 0; background: transparent; color: #a1a1aa; font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; }
.text-button:disabled { opacity: .45; cursor: default; }
.auth-card { max-width: 520px; margin: 7vh auto 0; }
.auth-message { margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: #13261a; border: 1px solid #254b31; font-size: .9rem; line-height: 1.45; }
.auth-message.error { background: #2b1717; border-color: #603030; }
.auth-hint { margin-top: 16px; }
.curriculum-intro { margin-bottom: 16px; }
.curriculum-back { margin-top: 18px; }
.curriculum-map { display: grid; gap: 14px; }
.curriculum-phase { background: #14161b; border: 1px solid #292d35; border-radius: 18px; overflow: hidden; }
.curriculum-phase.locked { opacity: .72; }
.curriculum-phase-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 18px 18px 14px; border-bottom: 1px solid #272a31; }
.curriculum-phase-head h2 { margin: 2px 0 0; font-size: 1.05rem; letter-spacing: -.02em; }
.phase-number { color: #8f95a1; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.phase-status, .status-chip { flex: 0 0 auto; font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 6px 9px; border: 1px solid #3a3e48; color: #c8cbd2; background: #1c1f25; }
.phase-status.current, .status-chip.current, .status-chip.available { color: #f6f7f8; border-color: #686e79; background: #2c3038; }
.phase-status.complete, .status-chip.ready, .status-chip.retained { color: #b9e6c8; border-color: #315c40; background: #17261d; }
.status-chip.repair { color: #ffd0c8; border-color: #69413b; background: #2e1a18; }
.phase-status.locked, .status-chip.locked { color: #858b96; border-color: #30333a; background: #17191e; }
.curriculum-skills { display: grid; }
.curriculum-skill { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 13px 18px; border-bottom: 1px solid #23262d; }
.curriculum-skill:last-child { border-bottom: 0; }
.curriculum-skill.locked strong { color: #858a95; }
.curriculum-skill-copy { display: flex; gap: 8px; align-items: center; min-width: 0; }
.curriculum-skill-copy strong { font-size: .9rem; line-height: 1.3; }
.optional-tag { color: #7f8591; font-size: .65rem; border: 1px solid #343842; border-radius: 999px; padding: 3px 6px; }
@media (max-width: 520px) {
  .app-shell { width: min(100% - 20px, 760px); padding-top: 18px; }
  .card { padding: 20px; border-radius: 17px; }
  .self-check-actions { grid-template-columns: 1fr; }
  .curriculum-phase-head, .curriculum-skill { padding-left: 14px; padding-right: 14px; }
  .curriculum-phase-head { align-items: flex-start; }
  .status-chip { font-size: .66rem; }
}
''')
          PY
      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/curriculum-ui.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const app = fs.readFileSync("web/app.js", "utf8");
          const css = fs.readFileSync("web/styles.css", "utf8");
          const lessons = fs.readFileSync("src/practice/lessons.ts", "utf8");

          test("curriculum roadmap is visible without becoming a skip menu", () => {
            assert.match(app, /View full curriculum/);
            assert.match(app, /See the whole path/);
            assert.match(app, /not a skip menu/i);
            assert.match(app, /prerequisites\.every/);
          });

          test("app is dark-only", () => {
            assert.match(css, /color-scheme:\s*dark/);
            assert.match(css, /background:\s*#0b0c0f/);
            assert.doesNotMatch(css, /prefers-color-scheme:\s*light/i);
          });

          test("first theory lesson explains enharmonic spelling in context", () => {
            assert.match(lessons, /The new idea here is enharmonic spelling/);
            assert.match(lessons, /A♯ and B♭/);
            assert.match(lessons, /F♯ major/);
          });
          EOF
      - name: Test and build site
        run: npm test && npm run build:site
      - name: Mirror production docs
        shell: bash
        run: |
          rm -rf docs
          cp -R site docs
      - name: Commit generated source and production site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web src/practice/lessons.ts tests/curriculum-ui.test.mjs docs
          git commit -m "Add curriculum roadmap, dark UI, and clearer lessons" || exit 0
          git push
