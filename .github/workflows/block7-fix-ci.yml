name: Block 7 One-Time CI Fix

on:
  push:
    branches: ["block7-phase6-circle-of-fifths"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Block 7 CI fixes
        run: node scripts/block7-fix-ci.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "fixes already applied"
            exit 0
          fi
          git commit -m "Fix Block 7 regression guards and review sampling"
          git push origin HEAD:block7-phase6-circle-of-fifths
