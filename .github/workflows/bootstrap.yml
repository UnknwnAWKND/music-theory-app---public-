name: Bootstrap Theory Tutor Source

on:
  push:
    branches: [main]
    paths:
      - bootstrap/READY
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail

          cat bootstrap/repair-13a.txt bootstrap/repair-13b.txt > /tmp/source-13.txt
          echo "e7326dd122b696f7be57e12dcd2c7a8850d5d82e9e076c68089d1e3187f7ebb8  /tmp/source-13.txt" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import string

          source = Path('bootstrap/source-14.txt').read_bytes()
          full_target = '75367b4b1fca20400e36ef448610308572ec3040c3178ad7e78e73d44c9aa69d'
          half0_target = '69f8abeea7e26de7d36a392bd81201f99e9854a3419092e3f2fa977f8b4104a7'
          half1_target = '24ce6df6905148ac03651adf717b92195109125c4ea93df3d6e21e9bacb95257'
          alphabet = (string.ascii_letters + string.digits + '+/=').encode()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          if len(source) != 8001:
              raise SystemExit(f'unexpected source-14 length: {len(source)}')

          fixed = None
          for deletion in range(len(source)):
              candidate = source[:deletion] + source[deletion + 1:]
              if sha(candidate) == full_target:
                  fixed = candidate
                  print(f'Fixed source-14 with deletion at {deletion}.')
                  break

              h0 = sha(candidate[:4000])
              h1 = sha(candidate[4000:])

              if h0 == half0_target:
                  data = bytearray(candidate)
                  for pos in range(4000, 8000):
                      old = data[pos]
                      for replacement in alphabet:
                          if replacement == old:
                              continue
                          data[pos] = replacement
                          if sha(data[4000:]) == half1_target and sha(data) == full_target:
                              fixed = bytes(data)
                              print(f'Fixed source-14 with deletion at {deletion} and substitution at {pos}.')
                              break
                      data[pos] = old
                      if fixed is not None:
                          break

              elif h1 == half1_target:
                  data = bytearray(candidate)
                  for pos in range(0, 4000):
                      old = data[pos]
                      for replacement in alphabet:
                          if replacement == old:
                              continue
                          data[pos] = replacement
                          if sha(data[:4000]) == half0_target and sha(data) == full_target:
                              fixed = bytes(data)
                              print(f'Fixed source-14 with deletion at {deletion} and substitution at {pos}.')
                              break
                      data[pos] = old
                      if fixed is not None:
                          break

              if fixed is not None:
                  break

          if fixed is None:
              raise SystemExit('source-14 did not match the verified hashes after bounded repair search')

          Path('/tmp/source-14.txt').write_bytes(fixed)
          PY

          echo "75367b4b1fca20400e36ef448610308572ec3040c3178ad7e78e73d44c9aa69d  /tmp/source-14.txt" | sha256sum -c -

          cat \
            bootstrap/source-00.txt \
            bootstrap/source-01.txt \
            bootstrap/source-02.txt \
            bootstrap/source-03.txt \
            bootstrap/source-04.txt \
            bootstrap/source-05.txt \
            bootstrap/source-06.txt \
            bootstrap/source-07.txt \
            bootstrap/source-08.txt \
            bootstrap/source-09.txt \
            bootstrap/source-10.txt \
            bootstrap/source-11.txt \
            bootstrap/source-12.txt \
            /tmp/source-13.txt \
            /tmp/source-14.txt \
            bootstrap/source-15.txt \
            > /tmp/music-theory-tutor.b64

          echo "1739a65831ee15f1a21b5e8545bda30090a62020ad44c72f77bc3084581377c0  /tmp/music-theory-tutor.b64" | sha256sum -c -
          base64 --decode /tmp/music-theory-tutor.b64 > /tmp/music-theory-tutor.zip
          echo "e5c6a16c85e6f9831fe2cf9f016aba8aad9dad305b6e75e7fbf7b087fd024076  /tmp/music-theory-tutor.zip" | sha256sum -c -

          rm -rf /tmp/music-theory-tutor-src
          mkdir -p /tmp/music-theory-tutor-src
          unzip -q /tmp/music-theory-tutor.zip -d /tmp/music-theory-tutor-src
          rsync -a --exclude='.git' --exclude='.github/workflows/' --exclude='bootstrap/' --exclude='node_modules/' /tmp/music-theory-tutor-src/ ./

      - name: Verify curriculum and learning engine before committing
        shell: bash
        run: |
          npm install --no-save typescript@5.9.2
          npm test
          rm -rf node_modules

      - name: Commit verified app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example ARCHITECTURE.md BUILD_STATUS.md CURRICULUM_AUDIT.md DEPLOYMENT_PREVIEW.md EXERCISE_COVERAGE.md README.md netlify.toml package.json scripts src supabase tests tsconfig.json web dist
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import verified music theory tutor v0.7 source"
            git push
          fi
