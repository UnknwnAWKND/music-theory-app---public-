name: Bootstrap Theory Tutor Source

on:
  push:
    branches: [main]
    paths:
      - bootstrap/READY
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-aa bootstrap/chunk-ab bootstrap/chunk-ac bootstrap/chunk-ad > /tmp/music-theory-tutor.b64
          python - <<'PY'
          import base64, pathlib, re
          raw = pathlib.Path('/tmp/music-theory-tutor.b64').read_text()
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw).rstrip('=')
          clean += '=' * ((-len(clean)) % 4)
          pathlib.Path('/tmp/music-theory-tutor.zip').write_bytes(base64.b64decode(clean))
          PY
          echo "e5c6a16c85e6f9831fe2cf9f016aba8aad9dad305b6e75e7fbf7b087fd024076  /tmp/music-theory-tutor.zip" | sha256sum -c -
          rm -rf /tmp/music-theory-tutor-src
          mkdir -p /tmp/music-theory-tutor-src
          unzip -q /tmp/music-theory-tutor.zip -d /tmp/music-theory-tutor-src
          rsync -a --exclude='.git' --exclude='.github/workflows/' --exclude='bootstrap/' --exclude='node_modules/' /tmp/music-theory-tutor-src/ ./
      - name: Verify before committing
        shell: bash
        run: |
          npm install --no-save typescript@5.9.2
          npm test
          rm -rf node_modules
      - name: Commit app source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example ARCHITECTURE.md BUILD_STATUS.md CURRICULUM_AUDIT.md DEPLOYMENT_PREVIEW.md EXERCISE_COVERAGE.md README.md netlify.toml package.json scripts src supabase tests tsconfig.json web dist
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import music theory tutor v0.7 source"
            git push
          fi
